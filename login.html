<script>
    function validarEmail(email) {
        let regex = /\S+@\S+\.\S+/;
        return regex.test(email);
    }

    const form = document.getElementById("form");

    form.addEventListener("submit", (e) => {
        e.preventDefault();

        let email = document.getElementById('email').value.trim().toLocaleLowerCase();
        let senha = document.getElementById('senha').value;

        if (email === '' || senha === '') {
            console.error("E-mail ou senha inválidos!");
            return null;
        }

        if (!validarEmail(email)) {
            console.error("E-mail de formato inválido!");
            return null;
        }

        const dadosLogin = {
            email: email,
            senha: senha
        }
        login(dadosLogin);
    })

    const login = (dadosLogin) => {
        if (dadosLogin) {
            fetch("http://localhost:8080/usuarios/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    email: dadosLogin.email,
                    senha: dadosLogin.senha,
                })
            }).then((resposta) => {
                if (resposta.status !== 200) {
                    console.error(resposta.text());
                    throw new Error("Código " + resposta.status);
                }
                return resposta.json();
            }).then((dados) => {
                const usuario = {
                    id: dados.id,
                    nome: dados.nome,
                    sobrenome: dados.sobrenome,
                    email: dados.email,
                    dataNascimento: dados.dataNascimento
                }
                sessionStorage.setItem("usuario", JSON.stringify(usuario));
                window.location.href = "/home.html";
            }).catch((erro) => {
                console.error(erro);
                document.getElementById('messages').innerHTML = `Ocorreu um erro: ${erro}`;
            })
        } else {
            console.error("Não há corpo para a requisição!");
        }
    }
</script>
