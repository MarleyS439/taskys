    <meta name="description" content=""/>
    <meta name="keywords" content=""/>
    <meta name="author" content="Marley de S. Santos"/>

    <!--Stylesheet-->
    <link rel="stylesheet" href="assets/css/home.css"/>

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <!--Title-->
    <title>Taskys | Lista de tarefas</title>
</head>

<body>
<!-- Modal novo item -->
<dialog class="modal-item" id="modal-item">
    <div class="modal-body">
        <div class="title">
            <h1>Nova tarefa</h1>
        </div>

        <div class="item">
            <label for="titulo">Título / Resumo</label>
            <input type="text" id="titulo"
                   placeholder="Ex.: Enviar o relatório de P.I, Finalizar atividade de Prog. Web">
        </div>

        <div class="col">
            <div class="">
                <label for="lista">Lista</label>
                <select id="lista"></select>
            </div>

            <div>
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>


        </div>

        <div class="item text">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Detalhe esta tarefa"></textarea>
        </div>
    </div>

    <!-- Botões -->
    <div class="buttons">
        <button type="button" id="cancelar">Cancelar</button>
        <button type="button" id="salvar">Salvar</button>
    </div>
</dialog>

<!--Modal de sair -->
<dialog class="modal-item mini-modal" id="modal-sair">
    <div class="modal-body">
        <div class="title">
            <h1>Sair</h1>
        </div>

        <div class="">
            <p>Você tem certeza que quer sair?</p>
        </div>

        <div class="buts">
            <button type="button" id="cancelar-sair">Cancelar</button>
            <button type="button" id="confirmar-sair">Sair</button>
        </div>
    </div>
</dialog>

<!--Modal de editar lista-->
<dialog class="modal-item mini-modal" id="modal-editar-lista">
    <div class="title">
        <h1>Editar lista</h1>
    </div>

    <div class="input-modal">
        <label for="nome-lista">Nome da lista</label>
        <input type="text" id="nome-lista" placeholder="Dê um nome a esta lista" required>
    </div>

    <div class="btns-modal">
        <button type="button" id="cancelar-editar-lista">Cancelar</button>
        <button type="button" id="salvar-edicao-lista">Salvar</button>
    </div>
</dialog>

<!--Modal para excluir lista-->
<dialog class="modal-item mini-modal" id="modal-excluir">
    <div class="title">
        <h1>Excluir lista?</h1>
    </div>

    <div class="">
        <p>Deseja excluir a lista e todas as tarefas atreladas?</p>
    </div>

    <div class="btns-modal">
        <button type="button" id="cancelar-excluir-lista" onclick="document.getElementById('modal-excluir').close();">
            Cancelar
        </button>
        <button type="button" id="confirmar-excluir-lista">Confirmar</button>
        <input type="text" value="" hidden id="idLista-Excluir">
    </div>
</dialog>

<!-- Modal para criar lista -->
<dialog class="modal-item mini-modal" id="modal-criar-lista">
    <div class="title">
        <h1>Criar nova lista</h1>
    </div>

    <div class="input-modal">
        <label for="nome-lista-criar">Nova lista</label>
        <input
                type="text"
                id="nome-lista-criar"
                placeholder="Nome da lista"
                maxlength="45"
        >
    </div>

    <div class="btns-modal">
        <button type="button" id="cancelar-criar-lista" onclick="document.getElementById('modal-criar-lista').close()">
            Cancelar
        </button>

        <button type="button" id="confirmar-criar-lista" onclick="criarLista()">
            Criar
        </button>
    </div>
</dialog>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        update();
    });

    const update = () => {
        const usuario = JSON.parse(sessionStorage.getItem("usuario"));
        carregarListas(usuario.id);
        carregarTarefas(usuario.id);
        document.getElementById('nomeUser').innerHTML = usuario.nome + " " + usuario.sobrenome;
        document.getElementById('emailUser').innerHTML = usuario.email;
    }

    const carregarListas = (idUsuario) => {
        fetch(`http://localhost:8080/listas/usuarios/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then((resposta) => {
            if (resposta.status !== 200) {
                console.error(resposta.text());
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((dados) => {
            let listaFormulario = "";
            let listaLateral = "";
            dados.forEach(lista => {
                console.log(lista);
                listaFormulario += ` <option value="${lista.nome}">${lista.nome}</option>`;
                listaLateral += `
                    <li>
                        <div class="item">
                            <span class="lista">${lista.nome}</span>
                        </div>

                        <div class="menu-btn" id="${lista.id}" onclick="submenu(this)">
                            <?xml version="1.0" encoding="utf-8"?>
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <g>
                                    <path
                                        d="M5 2.5C5 3.88075 3.88071 5 2.5 5C1.11929 5 0 3.88075 0 2.5C0 1.11925 1.11929 0 2.5 0C3.88071 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(3.75 12.5)" />
                                    <path
                                        d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(12.5 12.5)" />
                                    <path
                                        d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(21.25 12.5)" />
                                </g>
                            </svg>

                            <!-- Menu oculto -->
                            <div class="menu">
                                <div class="submenu" id="submenu-${lista.id}">
                                    <button type="button" id="edita-lista" onclick="editarLista(${lista.id}, '${lista.nome}')">Editar lista</button>
                                    <button type="button" onclick="excluirLista(${lista.id})">Excluir lista</button>
                                    <input type="text" hidden value="${lista.nome}" id="lista-${lista.nome}"/>
                                </div>
                            </div>
                        </div>
                    </li>
                    `;
            });

            document.getElementById("lista").innerHTML = listaFormulario;
            document.getElementById("lista-lateral").innerHTML = listaLateral;
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
        });
    }
    const carregarTarefas = (idUsuario) => {
        fetch(`http://localhost:8080/tarefas/usuarios/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then((resposta) => {
            if (resposta.status !== 200) {
                console.error(resposta.text());
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((dados) => {
            let html = "";
            console.log(dados);

            dados.forEach(tarefa => {
                html += `
                    <div class="card">

                    <div class="opts" id="opts-${tarefa.id}">
                        <button id="editar-${tarefa.id}" onclick="editarTarefa(${tarefa.id})">Editar tarefa</button>
                        <button onclick="excluirTarefa(${tarefa.id})">Excluir card</button>
                    </div>

                    <div class="titulo">
                        <span id="ti-${tarefa.id}">${tarefa.titulo}</span>

                        <button class="menu-opt" onclick="toggle(this)">
                            <?xml version="1.0" encoding="utf-8"?>
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <g>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88071 5 2.5 5C1.11929 5 0 3.88075 0 2.5C0 1.11925 1.11929 0 2.5 0C3.88071 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(3.75 12.5)"/>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(12.5 12.5)"/>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(21.25 12.5)"/>
                                </g>
                            </svg>
                        </button>

                    </div>

                    <div class="conteudo-card">
                        <p>${tarefa.descricao}</p>
                    </div>

                    <div class="outros">

                        <div class="colors">
                            <div class="lista">
                                ${tarefa.lista.nome}
                            </div>
                            <span>${tarefa.data != null ? new Date(tarefa.data + "T12:00:00").toLocaleString("pt-BR", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }) : "Sem data"}</span>
                        </div>

                        <div class="check">
                            <input
                                type="checkbox"
                                id="concluir-${tarefa.id}"
                                ${tarefa.status ? "checked" : ""}
                                onchange="alterarStatusTarefa(${tarefa.id}, this)"
                            >

                            <label for="concluir-${tarefa.id}">Concluída</label>
                        </div>
                    </div>
                </div>
                `
            })

            document.getElementById('lista-tarefas').innerHTML = html;
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
        });
    }

    const cadastrarTarefa = () => {
        let titulo = document.getElementById('titulo').value.trim();
        let listaTarefa = document.getElementById('lista').value.trim();
        let data = document.getElementById('data').value;
        let descricao = document.getElementById('descricao').value;

        if (titulo === "" || titulo.length < 3) {
            console.error("Título inválido!");
            return null;
        }
        if (listaTarefa === "") {
            console.error("Sem lista atribuída!");
            return null;
        }
        if (data === "") {
            console.warn("Sem data definida");
        }
        if (descricao === "") {
            console.warn("Descrição vazia");
        }

        const usuario = JSON.parse(sessionStorage.getItem("usuario"));

        fetch(`http://localhost:8080/listas?nome=${listaTarefa}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            },
        }).then((resposta) => {
            if (resposta.status === 404) {
                console.warn("Lista não encontrada.");
                return null;
            }
            if (!resposta.ok) {
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((lista) => {
            if (lista === null) {
                console.error("Não foi possível encontrar a lista, tarefa não criada.");
                return;
            }

            const dadosTarefa = {
                titulo: titulo,
                descricao: descricao,
                data: data
            };

            fetch(`http://localhost:8080/tarefas/usuarios/${usuario.id}/${lista.id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dadosTarefa)
            }).then((resposta) => {
                if (!resposta.ok) {
                    throw new Error("Código " + resposta.status);
                }
                return resposta.json();
            }).then((tarefaCriada) => {
                console.log("Tarefa criada:", tarefaCriada);
                document.getElementById("modal-item").close();
                update();
                titulo = "";
                listaTarefa = "";
                data = "";
                descricao = "";
            }).catch((erro) => {
                console.error("Ocorreu um erro ao criar tarefa: " + erro);
            });

        }).catch((erro) => {
            console.error("Ocorreu um erro ao buscar lista: " + erro);
        });
    }

    const btnNovaTarefa = document.getElementById("novo-item");

    btnNovaTarefa.addEventListener("click", () => {
        idTarefaEditando = null;
        document.getElementById("titulo").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("data").value = "";
        document.querySelector("#modal-item .title h1").textContent = "Nova tarefa";
        document.getElementById("modal-item").showModal();
    });

    const btnCancelarNovaTarefa = document.getElementById("cancelar");
    btnCancelarNovaTarefa.addEventListener("click", () => {
        document.getElementById("modal-item").close();
    });

    const btnSalvarNovaTarefa = document.getElementById("salvar");
    btnSalvarNovaTarefa.addEventListener("click", () => {
        if (idTarefaEditando !== null) {
            editarTarefaSalvar();
        } else {
            cadastrarTarefa();
        }
    });

    const btnFazerLogout = document.getElementById("logout");
    btnFazerLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").showModal();
    })

    const btnConfirmarLogout = document.getElementById("confirmar-sair");
    btnConfirmarLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").close();
        sessionStorage.clear();
        window.location.href = "/login.html";
    })

    const btnCancelarLogout = document.getElementById("cancelar-sair");
    btnCancelarLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").close();
    })

    function submenu(elemento) {
        let id = elemento.getAttribute("id");
        let submenu = elemento.querySelector(`#submenu-${id}`);
        submenu.classList.toggle("aberto");
    }

    let nomeAntigoLista = "";

    function editarLista(idLista, nomeLista) {
        let modalEditar = document.getElementById('modal-editar-lista');
        modalEditar.showModal();
        let nomeListaInput = document.getElementById('nome-lista');
        nomeListaInput.value = `${nomeLista}`;
        nomeAntigoLista = nomeLista;
    }

    let idListaExcluir;

    function excluirLista(idLista) {
        let modalExcluir = document.getElementById('modal-excluir');
        modalExcluir.showModal();
        document.getElementById('idLista-Excluir').value = idLista;
        idListaExcluir = Number(idLista);
    }

    const btnConfirmarDeleteLista = document.getElementById("confirmar-excluir-lista");
    btnConfirmarDeleteLista.addEventListener("click", () => {
        deletarLista(idListaExcluir);
    })

    const btnCancelarEdicaoLista = document.getElementById('cancelar-editar-lista');
    btnCancelarEdicaoLista.addEventListener("click", () => {
        document.getElementById('modal-editar-lista').close();
    })

    function atualizar(nomeAntigo) {
        let nomeNovo = document.getElementById("nome-lista").value.trim();

        if (nomeAntigo == null) {
            console.error("Nome inválido!");
            return;
        }

        fetch(`http://localhost:8080/listas?nome=${nomeAntigo}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then((resposta) => {

            if (!resposta.ok) {
                return resposta.text().then((texto) => {
                    console.error(texto);
                });
            }

            return resposta.json();
        }).then((dados) => {

            const listaAntiga = {}

            if (dados) {
                listaAntiga.id = dados.id;
            }

            fetch(`http://localhost:8080/listas/${listaAntiga.id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: Number(listaAntiga.id),
                    nome: nomeNovo
                }),
            }).then((resposta) => {
                if (!resposta.ok) {
                    return resposta.text().then((texto) => {
                        console.error(texto);
                    });
                }

                return resposta.json();
            }).then((dados) => {
                if (dados) {
                    console.log(dados);
                }
                window.location.reload();
            })
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
            throw new Error("Ocorreu um erro: " + erro);
        })
    }

    const btnSalvarEdicaoLista = document.getElementById('salvar-edicao-lista');
    btnSalvarEdicaoLista.addEventListener("click", () => atualizar(nomeAntigoLista));

    document.getElementById('confirmar-excluir-lista').addEventListener("click", () => {
        deletarLista(idListaExcluir);
    })

    const deletarLista = (idListaExcluir) => {
        fetch(`http://localhost:8080/listas/${idListaExcluir}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json",
            }
        }).then((resposta) => {
            if (!resposta.ok) {
                return resposta.text().then((texto) => {
                    console.error(texto);
                });
            }
            return resposta.json();
        }).then((dados) => {
            console.log(dados);
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
            throw new Error("Ocorreu um erro: " + erro);
        })
    }

    const btnCriarNovaLista = document.getElementById("criarNovaLista");
    btnCriarNovaLista.addEventListener("click", () => {
        document.getElementById('modal-criar-lista').showModal();
    })

    function criarLista() {
        const nome = document.getElementById("nome-lista-criar").value.trim();
        const usuario = JSON.parse(sessionStorage.getItem("usuario"));

        if (nome === "") {
            console.error("O nome da lista não pode ser vazio!");
            return;
        }

        fetch("http://localhost:8080/listas", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: nome,
                usuario: {
                    id: usuario.id
                }
            })
        }).then((resposta) => {
            if (!resposta.ok) {
                throw new Error(`Erro: ${resposta.status}`);
            }
            return resposta.json();
        }).then((dados) => {
            console.log("Lista criada:", dados);
            location.reload();
        }).catch((erro) => {
            console.error("Ocorreu um erro ao criar a lista:", erro);
        });
    }

    function toggle(botao) {
        const card = botao.closest(".card");
        const submenu = card.querySelector(".opts");
        submenu.style.display = submenu.style.display === "flex" ? "none" : "flex";
    }


    let idTarefaEditando = null;

    function editarTarefa(idTarefa) {
        idTarefaEditando = idTarefa;
        fetch(`http://localhost:8080/tarefas/${idTarefa}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(resposta => {
            if (!resposta.ok) {
                throw new Error(`Erro: ${resposta.status}`);
            }
            return resposta.json();
        }).then(dados => {

            const tarefa = dados;
            document.getElementById("titulo").value = tarefa.titulo;
            document.getElementById("descricao").value = tarefa.descricao;
            document.getElementById("data").value = tarefa.data ?? "";
            document.getElementById("lista").value = tarefa.lista.nome;
            document.querySelector("#modal-item .title h1").textContent = "Editar tarefa";
            document.getElementById("modal-item").showModal();

        }).catch(erro => {
            console.error("Erro ao buscar tarefa:", erro);
        });
    }

    function editarTarefaSalvar() {
        const titulo = document.getElementById("titulo").value.trim();
        const descricao = document.getElementById("descricao").value.trim();
        const data = document.getElementById("data").value;
        const nomeLista = document.getElementById("lista").value.trim();

        if (idTarefaEditando === null) {
            console.error("Nenhuma tarefa selecionada para edição.");
            return;
        }

        if (titulo === "" || titulo.length < 3) {
            console.error("Título inválido!");
            return;
        }

        if (nomeLista === "") {
            console.error("Nenhuma lista selecionada!");
            return;
        }

        fetch(`http://localhost:8080/listas?nome=${encodeURIComponent(nomeLista)}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(resposta => {
            if (!resposta.ok) {
                throw new Error(`Erro ao buscar lista: ${resposta.status}`);
            }
            return resposta.json();
        }).then(lista => {
            const dadosTarefa = {
                titulo: titulo,
                descricao: descricao,
                data: data === "" ? null : data,
                lista: {
                    id: lista.id
                }
            };

            return fetch(`http://localhost:8080/tarefas/${idTarefaEditando}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dadosTarefa)
            });
        }).then(resposta => {

            if (!resposta.ok) {
                throw new Error(`Erro ao atualizar tarefa: ${resposta.status}`);
            }

            return resposta.json();
        }).then(tarefaAtualizada => {
            console.log("Tarefa atualizada:", tarefaAtualizada);
            document.getElementById("modal-item").close();
            idTarefaEditando = null;
            update();
        }).catch(erro => {
            console.error("Erro ao atualizar tarefa:", erro);
        });
    }

    function alterarStatusTarefa(idTarefa, checkbox) {
        const concluida = checkbox.checked;
        const card = checkbox.closest(".card");

        fetch(`http://localhost:8080/tarefas/${idTarefa}/status`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                status: concluida
            })
        }).then(resposta => {
            if (!resposta.ok) {
                throw new Error(`Erro: ${resposta.status}`);
            }

            return resposta.json();
        }).then(tarefaAtualizada => {

            console.log("Status atualizado:", tarefaAtualizada);

            if (tarefaAtualizada.status) {
                card.classList.add("tarefa-concluida");
            } else {
                card.classList.remove("tarefa-concluida");
            }

        }).catch(erro => {
            console.error("Erro ao atualizar status:", erro);
            checkbox.checked = !concluida;
        });
    }

    function excluirTarefa(idTarefa) {
        const confirmar = confirm("Tem certeza que deseja excluir esta tarefa?");
        if (!confirmar) {
            return;
        }
        fetch(`http://localhost:8080/tarefas/${idTarefa}`, {
            method: "DELETE"
        }).then(resposta => {
            if (!resposta.ok) {
                throw new Error(`Erro ao excluir tarefa: ${resposta.status}`);
            }
            console.log("Tarefa excluída com sucesso.");
            update();
        }).catch(erro => {
            console.error("Erro ao excluir tarefa:", erro);
        });
    }
</script>
</body>
