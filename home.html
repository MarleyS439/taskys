<body>
<!-- Modal novo item -->
<dialog class="modal-item" id="modal-item">
    <div class="modal-body">
        <div class="title">
            <h1>Nova tarefa</h1>
        </div>

        <div class="item">
            <label for="titulo">Título / Resumo</label>
            <input type="text" id="titulo">
        </div>

        <div class="col">
            <div class="">
                <label for="lista">Lista</label>
                <select id="lista"></select>
            </div>

            <div>
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>


        </div>

        <div class="item text">
            <label for="descricao">Descrição</label>
            <textarea id="descricao"></textarea>
        </div>
    </div>

    <!-- Botões -->
    <div class="buttons">
        <button type="button" id="cancelar">Cancelar</button>
        <button type="button" id="salvar">Salvar</button>
    </div>
</dialog>

<dialog class="modal-item mini-modal" id="modal-sair">
    <div class="modal-body">
        <div class="title">
            <h1>Sair</h1>
        </div>

        <div class="">
            <p>Você tem certeza que quer sair?</p>
        </div>

        <div class="buts">
            <button type="button" id="cancelar-sair">Cancelar</button>
            <button type="button" id="confirmar-sair">Sair</button>
        </div>
    </div>
</dialog>

    <!-- Conteúdo -->

        <!--Lista lateral-->

                    <span id="nomeUser"></span>

                <div class="informacoes">

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        update();
    });

    const update = () => {
        const usuario = JSON.parse(sessionStorage.getItem("usuario"));
        carregarListas(usuario.id);
        carregarTarefas(usuario.id);
        document.getElementById('nomeUser').innerHTML = usuario.nome + " " + usuario.sobrenome;
        document.getElementById('emailUser').innerHTML = usuario.email;
    }

    const carregarListas = (idUsuario) => {
        fetch(`http://localhost:8080/listas/usuarios/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then((resposta) => {
            if (resposta.status !== 200) {
                console.error(resposta.text());
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((dados) => {
            let listaFormulario = "";
            let listaLateral = "";
            dados.forEach(lista => {
                console.log(lista);
                listaFormulario += ` <option value="${lista.nome}">${lista.nome}</option>`;
                listaLateral += `
                    <li>
                        <div class="item">
                            <span class="lista">${lista.nome}</span>
                        </div>

                        <div class="menu-btn" id="${lista.id}" onclick="submenu(this)">
                            <?xml version="1.0" encoding="utf-8"?>
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <g>
                                    <path
                                        d="M5 2.5C5 3.88075 3.88071 5 2.5 5C1.11929 5 0 3.88075 0 2.5C0 1.11925 1.11929 0 2.5 0C3.88071 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(3.75 12.5)" />
                                    <path
                                        d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(12.5 12.5)" />
                                    <path
                                        d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                        fill="#383838" transform="translate(21.25 12.5)" />
                                </g>
                            </svg>

                            <!-- Menu oculto -->
                            <div class="menu">
                                <div class="submenu" id="submenu-${lista.id}">
                                    <button type="button">Editar lista</button>
                                    <button type="button">Excluir lista</button>
                                </div>
                            </div>
                        </div>
                    </li>
                    `;
            });

            document.getElementById("lista").innerHTML = listaFormulario;
            document.getElementById("lista-lateral").innerHTML = listaLateral;
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
        });
    }
    const carregarTarefas = (idUsuario) => {
        fetch(`http://localhost:8080/tarefas/usuarios/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then((resposta) => {
            if (resposta.status !== 200) {
                console.error(resposta.text());
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((dados) => {
            let html = "";
            console.log(dados);

            dados.forEach(tarefa => {
                html += `
                    <div class="card">
                    <div class="opts" id="opts-${tarefa.id}">
                        <button id="editar-${tarefa.id}">Editar card</button>
                        <button>Excluir card</button>
                    </div>

                    <div class="titulo">
                        <span id="ti-${tarefa.id}">${tarefa.titulo}</span>

                        <button class="menu-opt" onclick="toggle(this)">
                            <?xml version="1.0" encoding="utf-8"?>
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <g>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88071 5 2.5 5C1.11929 5 0 3.88075 0 2.5C0 1.11925 1.11929 0 2.5 0C3.88071 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(3.75 12.5)"/>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(12.5 12.5)"/>
                                    <path
                                            d="M5 2.5C5 3.88075 3.88075 5 2.5 5C1.11925 5 0 3.88075 0 2.5C0 1.11925 1.11925 0 2.5 0C3.88075 0 5 1.11925 5 2.5Z"
                                            fill="#383838" transform="translate(21.25 12.5)"/>
                                </g>
                            </svg>
                        </button>

                    </div>

                    <div class="conteudo-card">
                        <p>${tarefa.descricao}</p>
                    </div>

                    <div class="outros">

                        <div class="colors">
                            <div class="lista">
                                ${tarefa.lista.nome}
                            </div>
                            <span>${new Date(tarefa.data + "T12:00:00").toLocaleString("pt-BR", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                })}</span>
                        </div>

                        <div class="check">
                            <input type="checkbox" id="concluir-${tarefa.id}">
                            <label for="concluir-${tarefa.id}">Concluída</label>
                        </div>
                    </div>
                </div>
                `
            })

            document.getElementById('lista-tarefas').innerHTML = html;
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
        });
    }

    const cadastrarTarefa = () => {
        let titulo = document.getElementById('titulo').value.trim();
        let listaTarefa = document.getElementById('lista').value.trim();
        let data = document.getElementById('data').value;
        let descricao = document.getElementById('descricao').value;

        if (titulo === "" || titulo.length < 3) {
            console.error("Título inválido!");
            return null;
        }
        if (listaTarefa === "") {
            console.error("Sem lista atribuída!");
            return null;
        }
        if (data === "") {
            console.warn("Sem data definida");
        }
        if (descricao === "") {
            console.warn("Descrição vazia");
        }

        const usuario = JSON.parse(sessionStorage.getItem("usuario"));

        fetch(`http://localhost:8080/listas?nome=${listaTarefa}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            },
        }).then((resposta) => {
            if (resposta.status === 404) {
                console.warn("Lista não encontrada.");
                return null;
            }
            if (!resposta.ok) {
                throw new Error("Código " + resposta.status);
            }
            return resposta.json();
        }).then((lista) => {
            if (lista === null) {
                console.error("Não foi possível encontrar a lista, tarefa não criada.");
                return;
            }

            const dadosTarefa = {
                titulo: titulo,
                descricao: descricao,
                data: data
            };

            fetch(`http://localhost:8080/tarefas/usuarios/${usuario.id}/${lista.id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dadosTarefa)
            }).then((resposta) => {
                if (!resposta.ok) {
                    throw new Error("Código " + resposta.status);
                }
                return resposta.json();
            }).then((tarefaCriada) => {
                console.log("Tarefa criada:", tarefaCriada);
                document.getElementById("modal-item").close();
                update();
                titulo = "";
                listaTarefa = "";
                data = "";
                descricao = "";
            }).catch((erro) => {
                console.error("Ocorreu um erro ao criar tarefa: " + erro);
            });

        }).catch((erro) => {
            console.error("Ocorreu um erro ao buscar lista: " + erro);
        });
    }

    const exibirMensagem = (tipo, mensagem) => {
        const aviso = {
            corTexto,
            corFundo
        }

        if (tipo === "erro") {
            aviso.corFundo = "var(--color-red)";
            aviso.corTexto = "var(--color-white)";
        } else {
            aviso.corFundo = "none";
            aviso.corTexto = "none";
        }
    }

    const btnNovaTarefa = document.getElementById("novo-item");
    btnNovaTarefa.addEventListener("click", () => {
        document.getElementById("modal-item").showModal();
    });

    const btnCancelarNovaTarefa = document.getElementById("cancelar");
    btnCancelarNovaTarefa.addEventListener("click", () => {
        document.getElementById("modal-item").close();
    });

    const btnSalvarNovaTarefa = document.getElementById("salvar");
    btnSalvarNovaTarefa.addEventListener("click", () => {
        cadastrarTarefa();
    })

    const btnFazerLogout = document.getElementById("logout");
    btnFazerLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").showModal();
    })

    const btnConfirmarLogout = document.getElementById("confirmar-sair");
    btnConfirmarLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").close();
        sessionStorage.clear();
        window.location.href = "/login.html";
    })

    const btnCancelarLogout = document.getElementById("cancelar-sair");
    btnCancelarLogout.addEventListener("click", () => {
        document.getElementById("modal-sair").close();
    })

    function submenu(elemento) {
        let id = elemento.getAttribute("id");
        let submenu = elemento.querySelector(`#submenu-${id}`);

        submenu.classList.toggle("aberto");
    }

    const deletarTarefa = (idTarefa) => {
        fetch(`http://localhost:8080/tarefas/${idTarefa}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json",
            }
        }).then((resposta) => {
            if (resposta.status !== 200) {
            }
        }).then((dados) => {
            console.log(dados);
        }).catch((erro) => {
            console.error("Ocorreu um erro: " + erro);
            throw new Error("Ocorreu um erro: " + erro);
        })
    }
</script>
</body>

</html>
